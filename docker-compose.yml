# Sobe a API com PostgreSQL localmente: docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: encurtador
      POSTGRES_PASSWORD: encurtador
      POSTGRES_DB: encurtador
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encurtador"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://encurtador:encurtador@db:5432/encurtador
      # Chave só para desenvolvimento local. Em produção use um valor secreto e aleatório.
      SECRET_KEY: chave-apenas-para-desenvolvimento-local-nao-use-em-producao
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
