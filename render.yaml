# Blueprint da Render: https://render.com/docs/blueprint-spec
databases:
  - name: encurtador-db
    plan: free
    databaseName: encurtador
    user: encurtador
    ipAllowList: [] # só serviços da própria Render acessam (conexão interna)

services:
  - type: web
    name: encurtador-urls
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true # novo deploy a cada push na branch principal
    envVars:
      - key: SECRET_KEY # assina os tokens de login (JWT); a Render gera um valor aleatório
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: encurtador-db
          property: connectionString
